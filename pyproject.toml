[project]
name = "interlinear"
version = "0.1.0"
description = "Converte PDF em EPUB, edita com preview ao vivo e traduz com a IA de sua escolha."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["epub", "pdf", "tradução", "ebook", "llm"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfminer.six>=20240706",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

# Sem [build-system] de propósito: o Interlinear não é instalado com pip. O
# backend serve a pasta frontend/ ao lado dele, que um pacote instalado não
# levaria. Para rodar, use o Docker (compose.yaml) ou o run.sh.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
