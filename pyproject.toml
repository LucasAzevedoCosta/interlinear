[project]
name = "interlinear"
version = "0.1.0"
description = "Converte PDF em EPUB, edita com preview ao vivo e traduz com a IA de sua escolha."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["epub", "pdf", "tradução", "ebook", "llm"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfminer.six>=20240706",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
interlinear = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
