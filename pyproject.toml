[project]
name = "interlinear"
version = "0.1.0"
description = "Converte PDF em EPUB, edita com preview ao vivo e traduz com a IA de sua escolha."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["epub", "pdf", "tradução", "ebook", "llm"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfminer.six>=20240706",
    "lxml>=5.2",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0", "ruff>=0.8", "pip-audit>=2.7", "bandit>=1.8"]

# Sem [build-system] de propósito: o Interlinear não é instalado com pip. Ele
# só roda em container (Dockerfile e compose.yaml), inclusive os testes.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
# Sem cache em disco: no container o código é montado só para leitura.
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Erros de verdade (nomes indefinidos, imports sem uso, sintaxe) e as
# armadilhas mais comuns do bugbear. O estilo fica com o `ruff format`, que a
# CI também confere.
select = ["F", "E4", "E7", "E9", "B"]
ignore = [
    "B008",  # Depends()/Body() como valor padrão é o jeito do FastAPI
    "B905",  # zip() sem strict=: as listas têm o mesmo tamanho por construção
]

[tool.bandit]
# B404/B603: o subprocess roda o Tesseract e o Claude Code, com argumentos
# montados aqui, nunca vindos do navegador. B311: random só espalha as
# retentativas no tempo, não protege nada.
skips = ["B404", "B603", "B311"]
