name: CI

# O Interlinear só roda em container, e a CI também: tudo acontece dentro da
# imagem `dev` do Dockerfile, a mesma do `docker compose run --rm dev`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Testes, linter e segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Constrói a imagem de desenvolvimento
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: interlinear:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Formatação (ruff format)
        run: docker run --rm interlinear:dev ruff format --check --diff .

      - name: Linter (ruff)
        run: docker run --rm interlinear:dev ruff check --output-format=github .

      - name: Testes (pytest)
        run: docker run --rm interlinear:dev pytest -q

      - name: Código (bandit)
        run: docker run --rm interlinear:dev bandit -q -c pyproject.toml -r backend/app

      - name: Dependências (pip-audit)
        run: docker run --rm interlinear:dev pip-audit -r requirements.txt

  imagem:
    name: Imagem de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Constrói a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: interlinear:ci
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Sobe o container e confere o health
        run: |
          docker run -d --name interlinear -p 127.0.0.1:8000:8000 interlinear:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then
              echo
              curl -sf -o /dev/null http://127.0.0.1:8000/ && echo "interface ok"
              exit 0
            fi
            sleep 1
          done
          docker logs interlinear
          exit 1
